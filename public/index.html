<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JAGUAR — Admin</title>
  <style>
    :root{--bg:#090b10;--panel:#11151d;--panel2:#0d1118;--line:#232a35;--text:#eef2f7;--muted:#8993a3;--accent:#e7b45f;--good:#55d68a;--bad:#ff7070}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#252018 0,#090b10 45%);font-family:Inter,system-ui,Arial;color:var(--text)}
    .wrap{max-width:1180px;margin:0 auto;padding:28px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-weight:900;letter-spacing:.12em}.logo span{color:var(--accent)}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:rgba(17,21,29,.92);border:1px solid var(--line);border-radius:16px;padding:18px}.metric{font-size:28px;font-weight:800;margin-top:6px}.muted{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;margin:20px 0}.tab{border:1px solid var(--line);background:var(--panel2);color:var(--muted);padding:10px 14px;border-radius:10px;cursor:pointer}.tab.active{color:var(--text);border-color:#665337;background:#1a1711}.section{display:none}.section.active{display:block}.row{display:flex;gap:10px;flex-wrap:wrap}.input,select{background:#0b0f15;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:#111;font-weight:800;cursor:pointer}.btn.dark{background:#1b212a;color:var(--text);border:1px solid var(--line)}.btn.danger{background:#3a1818;color:#ffb1b1;border:1px solid #5a2525}.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-weight:600}.badge{padding:4px 8px;border-radius:999px;background:#18231d;color:var(--good);font-size:12px}.badge.bad{background:#321818;color:#ffaaaa}.login{min-height:100vh;display:grid;place-items:center}.login .card{width:min(420px,92vw)}h1{font-size:24px}.qr{max-width:280px;border:1px solid var(--line);padding:10px;border-radius:14px;background:white}.output{margin-top:14px}.toast{position:fixed;right:20px;bottom:20px;background:#161b23;border:1px solid var(--line);padding:12px 14px;border-radius:12px;display:none}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{font-size:12px}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:16px}.table{display:block;overflow:auto;white-space:nowrap}}
  </style>
</head>
<body>
<div id="login" class="login" style="display:none"><div class="card"><div class="logo">JAGUAR <span>ADMIN</span></div><h1>Painel administrativo</h1><p class="muted">Acesse para gerenciar licenças e vendas.</p><form method="post" action="/login"><input class="input" style="width:100%" type="password" name="password" placeholder="Senha" required><button class="btn" style="width:100%;margin-top:10px">Entrar</button></form></div></div>
<div id="app" class="wrap" style="display:none">
  <div class="header"><div><div class="logo">JAGUAR <span>CLIENT</span></div><div class="muted">Painel de licenças + Revant Pay + Discord</div></div><a class="btn dark" href="/logout">Sair</a></div>
  <div class="grid"><div class="card"><div class="muted">Licenças</div><div id="mLic" class="metric">—</div></div><div class="card"><div class="muted">Ativas</div><div id="mAct" class="metric">—</div></div><div class="card"><div class="muted">Vendas pagas</div><div id="mSales" class="metric">—</div></div><div class="card"><div class="muted">Faturamento</div><div id="mRev" class="metric">—</div></div></div>
  <div class="tabs"><button class="tab active" data-tab="keys">Keys</button><button class="tab" data-tab="sales">Vendas</button><button class="tab" data-tab="checkout">Criar PIX</button></div>
  <section id="keys" class="section active"><div class="card"><div class="row"><input id="q" class="input" placeholder="Pesquisar key ou Discord ID"><button class="btn dark" onclick="loadKeys()">Pesquisar</button><button class="btn" onclick="createKeys()">Gerar key</button></div><div id="keysTable"></div></div></section>
  <section id="sales" class="section"><div class="card"><div id="salesTable"></div></div></section>
  <section id="checkout" class="section"><div class="card"><h2>Gerar cobrança PIX</h2><p class="muted">Cria uma cobrança Revant Pay para um usuário do Discord.</p><div class="row"><input id="discord" class="input" placeholder="Discord User ID"><input id="name" class="input" placeholder="Nome (opcional)"><input id="email" class="input" placeholder="E-mail (opcional)"><input id="amount" class="input" type="number" step="0.01" value="10.90"><input id="days" class="input" type="number" value="7"><button class="btn" onclick="checkout()">Criar PIX</button></div><div id="checkoutOut" class="output"></div></div></section>
</div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',3000)}
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erro');return d}
async function boot(){const s=await api('/api/session');if(!s.authenticated){$('#login').style.display='grid';return}$('#app').style.display='block';loadAll()}
async function loadAll(){const d=await api('/api/dashboard');$('#mLic').textContent=d.licenses;$('#mAct').textContent=d.active;$('#mSales').textContent=d.sales;$('#mRev').textContent=money(d.revenue);loadKeys();loadSales()}
async function loadKeys(){try{const rows=await api('/api/licenses?q='+encodeURIComponent($('#q').value));$('#keysTable').innerHTML=`<table class="table"><thead><tr><th>Key</th><th>Status</th><th>Expira</th><th>Discord</th><th>Ações</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${x.key}</b><div class="muted small">${x.product_name||''}</div></td><td><span class="badge ${x.status!=='active'?'bad':''}">${x.status}</span></td><td>${new Date(x.expires_at).toLocaleString('pt-BR')}</td><td>${x.discord_user_id||'—'}</td><td class="actions"><button class="btn dark" onclick='extendKey(${JSON.stringify(x.key)})'>+7d</button><button class="btn dark" onclick='unbindKey(${JSON.stringify(x.key)})'>Desvincular</button><button class="btn danger" onclick='revokeKey(${JSON.stringify(x.key)})'>Revogar</button></td></tr>`).join('')}</tbody></table>`}catch(e){toast(e.message)}}
async function loadSales(){const rows=await api('/api/orders');$('#salesTable').innerHTML=`<h2>Vendas</h2><table class="table"><thead><tr><th>Status</th><th>Discord</th><th>Produto</th><th>Valor</th><th>Key</th><th>Data</th></tr></thead><tbody>${rows.map(x=>`<tr><td><span class="badge ${x.status!=='paid'?'bad':''}">${x.status}</span></td><td>${x.discord_user_id}</td><td>${x.product_name}</td><td>${money(x.amount)}</td><td>${x.license_key||'—'}</td><td>${new Date(x.created_at).toLocaleString('pt-BR')}</td></tr>`).join('')}</tbody></table>`}
async function createKeys(){const days=prompt('Quantos dias?',7);if(!days)return;try{const r=await api('/api/licenses',{method:'POST',body:JSON.stringify({days,quantity:1})});toast('Key criada: '+r[0].key);loadAll()}catch(e){toast(e.message)}}
async function revokeKey(k){if(!confirm('Revogar '+k+'?'))return;try{await api('/api/licenses/'+encodeURIComponent(k)+'/revoke',{method:'POST'});toast('Key revogada');loadAll()}catch(e){toast(e.message)}}
async function unbindKey(k){try{await api('/api/licenses/'+encodeURIComponent(k)+'/unbind',{method:'POST'});toast('HWID desvinculado');loadAll()}catch(e){toast(e.message)}}
async function extendKey(k){try{await api('/api/licenses/'+encodeURIComponent(k)+'/extend',{method:'POST',body:JSON.stringify({days:7})});toast('+7 dias');loadAll()}catch(e){toast(e.message)}}
async function checkout(){const body={discord_user_id:$('#discord').value,customer_name:$('#name').value,customer_email:$('#email').value,amount:Number($('#amount').value),days:Number($('#days').value)};try{const r=await api('/api/checkout',{method:'POST',body:JSON.stringify(body)});$('#checkoutOut').innerHTML=`<div class="card" style="margin-top:14px;background:#0c1016"><h3>PIX criado</h3><p class="muted">Valor: <b>${money(r.amount)}</b></p><img class="qr" src="${r.pix.qr_code_url}" alt="QR Code PIX"><p><button class="btn" onclick="navigator.clipboard.writeText(${JSON.stringify(r.pix.qr_code)});toast('Copia e cola copiado')">Copiar PIX</button></p><div class="small muted">Charge ID: ${r.charge_id}</div></div>`}catch(e){toast(e.message)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});
boot().catch(()=>{location.reload()});
</script>
</body></html>
